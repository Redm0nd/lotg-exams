<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1d4ed8"/>
  <!-- Football pentagon pattern simplified -->
  <circle cx="256" cy="256" r="160" fill="white" opacity="0.12"/>
  <!-- Whistle icon -->
  <g fill="white">
    <!-- Whistle body -->
    <rect x="120" y="210" width="180" height="80" rx="40" fill="white"/>
    <!-- Whistle mouth piece -->
    <rect x="280" y="228" width="100" height="44" rx="8" fill="white"/>
    <!-- Whistle ball chamber -->
    <circle cx="160" cy="250" r="50" fill="#1d4ed8" stroke="white" stroke-width="10"/>
    <!-- Air hole -->
    <rect x="120" y="178" width="16" height="36" rx="8" fill="white"/>
  </g>
</svg>
